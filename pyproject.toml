[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb2pg"
version = "0.1.0"
description = "Offline InterBase GDB to PostgreSQL converter (no InterBase engine required)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.4", "psycopg[binary]>=3.1"]

[project.scripts]
gdb2pg = "gdb2pg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
